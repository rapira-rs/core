[workspace.package]
edition = "2024"

[package]
name = "rapira_core"
version = "0.8.0"
edition.workspace = true
description = "PHP application server: embeds NTS PHP via the embed SAPI and serves HTTP directly"
homepage = "https://rapira.rs"
documentation = "https://rapira.rs/docs/"
repository = "https://github.com/rapira-rs/rapira"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rapira"
path = "src/main.rs"


[workspace]
members = [
    "crates/config",
    "crates/runtime",
    "crates/api",
    "crates/tests",
    "crates/master",
    "crates/php_sys",
    "crates/scoreboard",
    "crates/plugins/tower",
]

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
php_sys = { path = "crates/php_sys" }
rapira_runtime = { path = "crates/runtime" }
rapira_config = { path = "crates/config" }
extension_api = { path = "crates/api" }
rapira_tower = { path = "crates/plugins/tower" }
rapira_master = { path = "crates/master" }
rapira_scoreboard = { path = "crates/scoreboard" }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
extension_api = { workspace = true }
rapira_master = { workspace = true }
rapira_scoreboard = { workspace = true }
rapira_runtime = { workspace = true }
php_sys = { workspace = true }
rapira_config = { workspace = true }
rapira_tower = { workspace = true }
libc = "0.2"
mimalloc = "0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "json"] }

[dev-dependencies]
serde_json = "1"
