[package]
name = "rapira_core"
version = "0.6.0"
edition = "2024"

[[bin]]
name = "rapira"
path = "src/main.rs"


[workspace]
# crates/* cannot stay a glob: it would match the plugins parent dir, which is
# not a package. Top-level crates are explicit; plugins keep the glob.
members = [
    "crates/config",
    "crates/runtime",
    "crates/api",
    "crates/tests",
    "crates/master",
    "crates/php_sys",
    "crates/scoreboard",
    "crates/plugins/*",
]

[workspace.dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
php_sys = { path = "crates/php_sys" }
rapira_runtime = { path = "crates/runtime" }
rapira_config = { path = "crates/config" }
extension_api = { path = "crates/api" }
rapira_pingora = { path = "crates/plugins/pingora" }
rapira_master = { path = "crates/master" }
rapira_scoreboard = { path = "crates/scoreboard" }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
env_logger = "0.11"

[workspace.lints.clippy]
all = "warn"

[profile.release]
# Cross-crate LTO + a single codegen unit: the hot path spans the pingora/tokio/plugin crates
# as many small cross-crate calls.
# NOTE: `panic` must stay "unwind". php_sys::callbacks::guard wraps every SAPI callback in
# catch_unwind, and that is the only thing turning a panic inside PHP into "fail this request
# and recycle the worker" instead of aborting the process. Cargo ignores `panic` for the test
# profile, so switching it here would not fail any test.
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
extension_api = { workspace = true }
rapira_master = { workspace = true }
rapira_scoreboard = { workspace = true }
rapira_runtime = { workspace = true }
php_sys = { workspace = true }
rapira_config = { workspace = true }
rapira_pingora = { workspace = true }
mimalloc = "0.1"
log.workspace = true
env_logger.workspace = true
