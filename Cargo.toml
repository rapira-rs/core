[package]
name = "rapira_core"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "rapira"
path = "src/main.rs"


[workspace]
# crates/* cannot stay a glob: it would match the plugins parent dir, which is
# not a package. Top-level crates are explicit; plugins keep the glob.
members = [
    "crates/config",
    "crates/extension_host",
    "crates/extensions_api",
    "crates/integration_tests",
    "crates/master",
    "crates/php_sys",
    "crates/scoreboard",
    "crates/plugins/*",
]

[workspace.dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
php_sys = { path = "crates/php_sys" }
extension_host = { path = "crates/extension_host" }
rapira_config = { path = "crates/config" }
extension_api = { path = "crates/extensions_api" }
rapira_pingora = { path = "crates/plugins/pingora" }
rapira_master = { path = "crates/master" }
rapira_scoreboard = { path = "crates/scoreboard" }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
env_logger = "0.11"

[workspace.lints.clippy]
all = "warn"

[profile.release]
# Cross-crate LTO + single codegen unit: the hot path spans pingora/tokio/plugin
# crates, and the per-request cost is spread across many small cross-crate calls.
# NOTE: panic stays "unwind" — php_sys contains bailouts with catch_unwind.
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
extension_api = { workspace = true }
rapira_master = { workspace = true }
rapira_scoreboard = { workspace = true }
extension_host = { workspace = true }
php_sys = { workspace = true }
rapira_config = { workspace = true }
rapira_pingora = { workspace = true }
mimalloc = "0.1"
log.workspace = true
env_logger.workspace = true
