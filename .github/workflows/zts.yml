name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # macOS/Windows cargo legs are expected to fail until the native port lands —
    # keep them informational so a genuinely broken Linux leg stands out.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        php: ["8.4", "8.5"]
        include:
          - { os: macos-latest, experimental: true }
          - { os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: ts # thread-safe (ZTS)

      - name: Build deps for bindgen/cc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

      - name: Expose the ZTS embed lib (Linux)
        if: runner.os == 'Linux'
        run: |
          LIBPHP=$(find "$(php-config --prefix)" -name 'libphp*.so' 2>/dev/null | head -1)
          test -n "$LIBPHP" || { echo "no ZTS libphp.so from setup-php"; exit 1; }
          echo "LD_LIBRARY_PATH=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"

      - name: Expose the ZTS embed lib (macOS)
        if: runner.os == 'macOS'
        run: |
          LIBPHP=$(find "$(php-config --prefix)" -name 'libphp*.dylib' 2>/dev/null | head -1)
          test -n "$LIBPHP" || { echo "no ZTS libphp.dylib from setup-php"; exit 1; }
          echo "DYLD_LIBRARY_PATH=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"

      - name: Fetch the PHP devel pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          php -v
          $releases = Invoke-RestMethod -Uri 'https://downloads.php.net/~windows/releases/releases.json'
          $branch = $releases.'${{ matrix.php }}'
          $variant = $branch.PSObject.Properties.Name | Where-Object { $_ -like 'ts-*-x64' } | Select-Object -First 1
          if (-not $variant) { throw "no ts x64 build found for PHP ${{ matrix.php }}" }
          $develZip = $branch.$variant.devel_pack.path
          $url = "https://downloads.php.net/~windows/releases/$develZip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\php-devel.zip"
          Expand-Archive "$env:RUNNER_TEMP\php-devel.zip" -DestinationPath "$env:RUNNER_TEMP\php-devel"
          $devel = (Get-ChildItem "$env:RUNNER_TEMP\php-devel" -Directory | Select-Object -First 1).FullName
          Write-Host "devel pack at $devel"
          "PHP_DEVEL_DIR=$devel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-L native=$devel\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # macOS/Windows legs fail in cargo until the port lands; still save the deps cache.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
