name: Nightly
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# concurrency is decided before any job if, so ineligible runs (failed CI,
# fork-PR CI runs, dispatch outside main) must not share the publishing group
# or they cancel an in-flight publish; the predicate mirrors the guard job's if
concurrency:
    group: nightly-${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'publish' || github.run_id }}
    cancel-in-progress: true

# One build per merge to main, gated on that commit's CI run succeeding.
# Same tag policy as docker.yml (every tag names its PHP minor): an immutable
# <version>-nightly.<shortsha>-phpN.M tag plus a moving nightly-phpN.M alias.
env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    guard:
        # the branches filter alone also admits CI runs of PRs whose fork branch
        # is named main, so the run must additionally come from a push event
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.v.outputs.version }}
            sha: ${{ steps.v.outputs.sha }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  persist-credentials: false
            - id: v
              env:
                  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  set -euo pipefail
                  CARGO_VER=$(awk -F'"' '/^\[workspace\.package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
                  test -n "$CARGO_VER"
                  echo "version=${CARGO_VER}-nightly.${SHA:0:7}" >> "$GITHUB_OUTPUT"
                  echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

    build:
        needs: guard
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                arch: [amd64, arm64]
                include:
                    - { arch: amd64, runner: ubuntu-latest }
                    - { arch: arm64, runner: ubuntu-24.04-arm }
                    - {
                          php: "8.4",
                          base: "php:8.4-cli-trixie@sha256:f78661b492226388a7057679cc731c3e43bc92ba66cd49a8cfe12374a56bee9f",
                      }
                    - {
                          php: "8.5",
                          base: "php:8.5-cli-trixie@sha256:54d82ff9be6bd198145e90c917fc9b2e24230b42e52def8deb3554baf61c451a",
                      }
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  ref: ${{ needs.guard.outputs.sha }}
                  persist-credentials: false
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  target: runtime
                  build-args: PHP_BASE=${{ matrix.base }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ needs.guard.outputs.version }}-php${{ matrix.php }}-${{ matrix.arch }}
                  cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.arch }}

    merge:
        needs: [guard, build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
        steps:
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - shell: bash
              env:
                  PHP: ${{ matrix.php }}
                  V: ${{ needs.guard.outputs.version }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools create \
                    -t "$IMAGE:$V-php$PHP" \
                    -t "$IMAGE:nightly-php$PHP" \
                    "$IMAGE:$V-php$PHP-amd64" "$IMAGE:$V-php$PHP-arm64"

    cleanup:
        needs: [guard, merge]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            V: ${{ needs.guard.outputs.version }}
            KEEP: "10"
        steps:
            - shell: bash
              run: |
                  set -euo pipefail
                  API="/orgs/${GITHUB_REPOSITORY%%/*}/packages/container/${GITHUB_REPOSITORY#*/}/versions"

                  # tagged nightly versions only; untagged versions hold multi-arch
                  # children and attestations and must never be deleted
                  gh api --paginate "${API}?per_page=100" --jq '
                    .[]
                    | .metadata.container.tags as $t
                    | select(($t | length) > 0)
                    | select([$t[] | test("-nightly\\.[0-9a-f]+-php|^nightly-php")] | all)
                    | (([$t[] | capture("^(?<b>.*-nightly\\.[0-9a-f]+)-php")? | .b] | first) // empty) as $build
                    | [$build, .created_at, .id] | @tsv
                  ' > candidates.tsv

                  # the build this run just pushed must be selected; if it is not,
                  # the filter no longer matches what merge publishes
                  awk -F'\t' -v v="$V" '$1 == v { found = 1 } END { exit !found }' candidates.tsv

                  keep=$(sort -t$'\t' -k2,2r candidates.tsv | awk -F'\t' -v k="$KEEP" '!seen[$1]++ { if (++n <= k) print $1 }')

                  while IFS=$'\t' read -r build created id; do
                      grep -qxF "$build" <<< "$keep" && continue
                      gh api --silent -X DELETE "${API}/${id}" || { echo "::warning::failed to delete ${id} (${build})"; continue; }
                      echo "deleted ${id} (${build}, ${created})"
                  done < candidates.tsv
