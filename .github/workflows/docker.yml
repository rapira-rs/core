name: Docker
on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

# Every tag names its PHP minor. There is deliberately no `latest` and no
# unsuffixed version tag: the payload only works against the minor it was built
# for (rapira refuses to boot otherwise), and a tag that hides which one it
# carries is a tag nobody can use safely.
env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                arch: [amd64, arm64]
                include:
                    - { arch: amd64, runner: ubuntu-latest }
                    - { arch: arm64, runner: ubuntu-24.04-arm }
                    - {
                          php: "8.4",
                          base: "php:8.4-cli-trixie@sha256:f78661b492226388a7057679cc731c3e43bc92ba66cd49a8cfe12374a56bee9f",
                      }
                    - {
                          php: "8.5",
                          base: "php:8.5-cli-trixie@sha256:54d82ff9be6bd198145e90c917fc9b2e24230b42e52def8deb3554baf61c451a",
                      }
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with: { persist-credentials: false }
            - id: v
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  target: runtime
                  build-args: PHP_BASE=${{ matrix.base }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-php${{ matrix.php }}-${{ matrix.arch }}
                  cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.arch }}

    merge:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
        steps:
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - shell: bash
              env:
                  PHP: ${{ matrix.php }}
              run: |
                  set -euo pipefail
                  V="${GITHUB_REF_NAME#v}"
                  TAGS=(-t "$IMAGE:$V-php$PHP")
                  case "$V" in
                    *-*) ;;
                    *) TAGS+=(-t "$IMAGE:${V%.*}-php$PHP" -t "$IMAGE:php$PHP") ;;
                  esac
                  docker buildx imagetools create "${TAGS[@]}" \
                    "$IMAGE:$V-php$PHP-amd64" "$IMAGE:$V-php$PHP-arm64"
