name: Docker
# Reusable: release-please.yml calls it with the release tag. Tags created with the
# default GITHUB_TOKEN fire no push triggers, so there is no tag-push trigger here.
on:
    workflow_call:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                required: true
            version:
                description: "Image version tag, without the v prefix"
                type: string
                required: true
            alias:
                description: "Extra moving alias prefix for the merged tags, such as nightly"
                type: string
                default: ""
    workflow_dispatch:
        inputs:
            ref:
                description: "Tag or commit to build"
                type: string
                default: main
            version:
                description: "Image version tag, without the v prefix"
                type: string
                required: true

permissions:
    contents: read

# Every tag names its PHP minor: the payload only boots against the minor it was built for, so there is no `latest` and no unsuffixed version tag.
env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                arch: [amd64, arm64]
                include:
                    - { arch: amd64, runner: ubuntu-latest }
                    - { arch: arm64, runner: ubuntu-24.04-arm }
                    - {
                          php: "8.4",
                          base: "php:8.4-cli-trixie@sha256:f78661b492226388a7057679cc731c3e43bc92ba66cd49a8cfe12374a56bee9f",
                      }
                    - {
                          php: "8.5",
                          base: "php:8.5-cli-trixie@sha256:54d82ff9be6bd198145e90c917fc9b2e24230b42e52def8deb3554baf61c451a",
                      }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  target: runtime
                  build-args: PHP_BASE=${{ matrix.base }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ inputs.version }}-php${{ matrix.php }}-${{ matrix.arch }}
                  cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.arch }}

    merge:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
        steps:
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # The release aliases (X.Y-phpN.M, phpN.M) are re-pointed by the publish
            # job in release-please.yml after the release is published, so a failed
            # release run cannot move them early. The alias input adds a caller-owned
            # moving alias instead (nightly).
            - shell: bash
              env:
                  PHP: ${{ matrix.php }}
                  V: ${{ inputs.version }}
                  ALIAS: ${{ inputs.alias }}
              run: |
                  set -euo pipefail
                  TAGS=(-t "$IMAGE:$V-php$PHP")
                  [ -z "$ALIAS" ] || TAGS+=(-t "$IMAGE:$ALIAS-php$PHP")
                  docker buildx imagetools create "${TAGS[@]}" \
                    "$IMAGE:$V-php$PHP-amd64" "$IMAGE:$V-php$PHP-arm64"
