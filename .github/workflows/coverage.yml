name: Coverage
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # setup-php's version and the versioned libphp path below must agree
      PHP_VERSION: "8.5"
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload (unavailable on fork PRs; see use_oidc below)
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # this job measures Rust coverage; a PHP coverage driver adds nothing and, left unset,
          # overrides zend_error_cb and zend_execute_ex in the embed SAPI
          coverage: none
          # keep in sync with ci.yml and ci/php-configure-flags.txt — an extension missing here
          # makes its php_ext test skip rather than fail, so coverage silently stops measuring it
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, opcache, openssl, pdo_sqlite, phar, session, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
        env:
          phpts: nts
          fail-fast: true # a missing extension fails the job instead of warning

      # `coverage: none` above disables it; assert, so a driver leaking back in fails here
      # instead of surfacing as diagnostics that never went through php_error_cb. This reads the
      # CLI SAPI: a proxy, since drivers are enabled per-SAPI and no tool reports the embed
      # conf.d. Both are cleared by the same phpdismod, so a leak shows up here too.
      - name: Verify no coverage driver in the PHP build
        run: |
          mods=$(php -m); echo "$mods"
          if grep -qiE '^(xdebug|pcov)$' <<<"$mods"; then
            echo "::error::a PHP coverage driver is enabled; it overrides zend_error_cb and JIT in the embed SAPI"
            exit 1
          fi

      - name: Build deps for bindgen/cc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

      # setup-php's cached NTS tarball ships the embed SAPI as a versioned
      # /usr/lib/libphpX.Y.so; `-lphp` needs the plain name, so pin the exact
      # version and symlink it into a private dir to link against.
      - name: Expose the PHP embed lib
        run: |
          LIBPHP=/usr/lib/libphp${PHP_VERSION}.so
          test -e "$LIBPHP" || { echo "missing $LIBPHP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/phplib"
          ln -sf "$LIBPHP" "$RUNNER_TEMP/phplib/libphp.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/phplib:/usr/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$RUNNER_TEMP/phplib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          # a failing test run would otherwise discard the instrumented deps
          cache-on-failure: true

      - name: Generate coverage (lcov)
        run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          --ignore-filename-regex '(crates/tests/|bindings\.rs$|/src/main\.rs$)'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
