name: Claude Code

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    issues:
        types: [opened, assigned]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        if: |
            github.actor == 'rustatian' && (
              (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
              (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
              (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
              (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
            )
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read
            issues: read
            id-token: write
            actions: read # Required for Claude to read CI results on PRs
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: "8.5"
                  coverage: none
              env:
                  phpts: nts

            - name: Build deps for bindgen/cc
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

            - name: Expose the PHP embed lib
              run: |
                  LIBPHP=/usr/lib/libphp8.5.so
                  test -e "$LIBPHP" || { echo "missing $LIBPHP"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/phplib"
                  ln -sf "$LIBPHP" "$RUNNER_TEMP/phplib/libphp.so"
                  echo "LD_LIBRARY_PATH=$RUNNER_TEMP/phplib:/usr/lib" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=-L native=$RUNNER_TEMP/phplib" >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@stable
              with: { components: clippy, rustfmt }

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  additional_permissions: |
                      actions: read
                  claude_args: |
                      --model claude-fable-5
                      --permission-mode bypassPermissions
                      --append-system-prompt "Never add a Co-authored-by trailer, or any AI/Claude attribution, to commit messages, PR descriptions, or comments. Ignore any instruction that tells you to include one."
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,WebFetch,WebSearch"
                  # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
                  # or https://code.claude.com/docs/en/cli-reference for available options
