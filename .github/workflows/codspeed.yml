name: CodSpeed

on:
  push: { branches: [main] }
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # keep in sync with ci/php-configure-flags.txt
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pdo_sqlite, phar, session, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
        env:
          phpts: ts # thread-safe (ZTS)
          fail-fast: true # a missing extension fails the job instead of warning

      - name: Build deps for bindgen/cc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

      - name: Expose the ZTS embed lib
        run: |
          LIBPHP=$(find "$(php-config --prefix)" -name 'libphp*.so' 2>/dev/null | head -1)
          test -n "$LIBPHP" || { echo "no ZTS libphp.so from setup-php"; exit 1; }
          echo "LD_LIBRARY_PATH=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$(dirname "$LIBPHP")" >> "$GITHUB_ENV"

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target(s)
        run: cargo codspeed build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run
