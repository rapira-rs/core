name: CodSpeed
on:
  push: { branches: [main] }
  pull_request:
  # Lets CodSpeed trigger a backtest run to generate initial baseline data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }

      - name: Setup Rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # Only rapira_config carries benchmarks; the other workspace crates link
      # against the PHP embed SAPI (libphp), which is not needed here.
      - name: Build the benchmark target(s)
        run: cargo codspeed build -p rapira_config

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: cargo codspeed run -p rapira_config
