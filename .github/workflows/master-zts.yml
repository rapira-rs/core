name: CI (ZTS + debug, php-src master)
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: "0 6 * * *" }]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PHP_PREFIX: ${{ github.workspace }}/.php-zts-debug
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false

      # extension_host path-depends on php_value and reads the WIT package from
      # this sibling checkout, so core does not build without it.
      - uses: actions/checkout@v4
        with:
          repository: rapira-rs/extensions
          path: extensions
          persist-credentials: false

      - name: Install build deps (php-src from git + bindgen/cc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl git autoconf bison re2c \
            libclang-dev llvm-dev

      - name: Resolve php-src master commit
        id: phpsrc
        run: echo "sha=$(git ls-remote https://github.com/php/php-src.git master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ZTS+debug PHP (embed SAPI)
        id: php
        uses: actions/cache@v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: php-zts-debug-${{ runner.os }}-${{ steps.phpsrc.outputs.sha }}-embed-signals-v6

      - name: Build ZTS+debug PHP (embed SAPI) from php-src master
        if: steps.php.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master https://github.com/php/php-src.git
          cd php-src
          ./buildconf --force
          ./configure \
            --prefix="${PHP_PREFIX}" \
            --enable-zts \
            --enable-debug-assertions \
            --enable-zend-test \
            --enable-debug \
            --enable-embed=shared \
            --disable-all --disable-cgi --enable-session --enable-filter --without-pear
          make -j"$(nproc)"
          make install

      - name: Expose PHP to build + tests
        run: |
          echo "${PHP_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"

      # wasmtime 46 needs Rust >= 1.94; the workspace pins rust-version = 1.96.1.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            extensions

      - name: Check the extensions repo (codec + guest SDK)
        working-directory: extensions
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # The extension e2e tests read the component from the workspace target and skip
      # when it is absent, so build it there directly.
      - name: Build the hello extension component (wasm32-wasip2)
        working-directory: extensions
        run: cargo build -p hello --target wasm32-wasip2 --release

      # Smoke-test the packaging CLI (writes examples/hello/{target,dist}).
      - name: Package the hello extension via the CLI
        working-directory: extensions
        run: cargo run -q -p rapira-extension -- build examples/hello

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
