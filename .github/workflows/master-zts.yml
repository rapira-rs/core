name: CI (ZTS + debug, php-src master)
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: "0 6 * * *" }]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      PHP_PREFIX: ${{ github.workspace }}/.php-zts-debug
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: core
          persist-credentials: false

      # php-src's Windows install rules pass the prefix unquoted to copy/xcopy,
      # which treat '/' as a switch — the prefix must be pure backslashes.
      - name: Use native path separators in PHP_PREFIX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "PHP_PREFIX=$($env:PHP_PREFIX.Replace('/', '\'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl git autoconf bison re2c \
            libclang-dev llvm-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev libonig-dev \
            libsqlite3-dev zlib1g-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf bison re2c pkg-config openssl@3 curl oniguruma libxml2 sqlite
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Resolve php-src master commit
        id: phpsrc
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/php/php-src.git master | cut -f1)" >> "$GITHUB_OUTPUT"

      # restore/save are split so the 15-25 min PHP build is persisted even when a
      # later cargo step fails — actions/cache@v4's post-save only runs on job success.
      - name: Restore ZTS+debug PHP (embed SAPI)
        id: php
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: php-zts-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.phpsrc.outputs.sha }}-embed-signals-v9-${{ hashFiles('core/ci/php-configure-flags.txt') }}

      - name: Build ZTS+debug PHP (embed SAPI) from php-src master (Unix)
        if: runner.os != 'Windows' && steps.php.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master https://github.com/php/php-src.git
          cd php-src
          ./buildconf --force
          # Release extension set (ci/php-configure-flags.txt) + debug/zend-test extras.
          # --enable-opcache in the flags file is a no-op warning on master (opcache is
          # always built since 8.5).
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            # bare --with-iconv cannot locate libiconv on macOS; appended after the
            # file flags so autoconf last-wins applies (mirrors release.yml).
            EXTRA="--with-iconv=$(xcrun --show-sdk-path)/usr"
          fi
          ./configure \
            --prefix="${PHP_PREFIX}" \
            --enable-debug-assertions \
            --enable-zend-test \
            --enable-debug \
            $(tr '\n' ' ' < "$GITHUB_WORKSPACE/core/ci/php-configure-flags.txt") $EXTRA
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Build ZTS+debug PHP (embed SAPI) from php-src master (Windows)
        if: runner.os == 'Windows' && steps.php.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch master https://github.com/php/php-src.git
          git clone --depth 1 --branch php-sdk-2.7.1 https://github.com/php/php-sdk-binary-tools.git "$env:RUNNER_TEMP\php-sdk"
          $task = @'
          call phpsdk_deps --update --no-backup --branch master --stability staging --deps %RUNNER_TEMP%\php-deps || exit /b 1
          call buildconf.bat || exit /b 1
          rem fileinfo is forced shared on Windows (config.w32 hardcodes it), so it cannot
          rem be embedded statically - omitted; its tests skip via the fixture guard.
          rem openssl needs an explicit =yes: the bare flag inherits its "no,shared" default.
          call configure.bat --with-prefix=%PHP_PREFIX% --enable-zts --enable-debug --enable-zend-test --enable-embed --enable-cli --disable-all --disable-cgi --with-php-build=%RUNNER_TEMP%\php-deps --enable-session --enable-filter --enable-ctype --enable-tokenizer --enable-phar --enable-mbstring --enable-zlib --with-iconv --with-openssl=yes --with-curl --with-libxml --with-dom --with-simplexml --with-xml --enable-xmlreader --enable-xmlwriter --enable-pdo --with-pdo-sqlite --with-sqlite3 || exit /b 1
          nmake || exit /b 1
          nmake install || exit /b 1
          '@
          Set-Content -Path php-src\rapira-build-task.bat -Value $task -Encoding ascii
          Set-Location php-src
          cmd /c "$env:RUNNER_TEMP\php-sdk\phpsdk-vs18-x64.bat -t rapira-build-task.bat"
          if ($LASTEXITCODE -ne 0) { throw "php-src master build failed" }
          # Make sure import libs + headers land inside the cached prefix, whatever
          # `nmake install` chose to install (layouts differ between php versions).
          New-Item -ItemType Directory -Force "$env:PHP_PREFIX\lib" | Out-Null
          Get-ChildItem -Recurse -Filter 'php8*.lib' x64 | Copy-Item -Destination "$env:PHP_PREFIX\lib" -Force
          foreach ($d in 'main', 'Zend', 'TSRM', 'ext', 'win32') {
            robocopy $d "$env:PHP_PREFIX\include\$d" *.h /s | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "header copy failed for $d" }
          }
          cmd /c exit 0

      - name: Save ZTS+debug PHP cache
        if: steps.php.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: php-zts-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.phpsrc.outputs.sha }}-embed-signals-v9-${{ hashFiles('core/ci/php-configure-flags.txt') }}

      - name: Expose PHP to build + tests (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "${PHP_PREFIX}/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"
          fi

      - name: Expose PHP to build + tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:PHP_PREFIX" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PHP_DEVEL_DIR=$env:PHP_PREFIX" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-L native=$env:PHP_PREFIX\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Extensions are compiled statically, so `php -m` reflects the embed SAPI too.
      - name: Verify built extension set (Unix)
        if: runner.os != 'Windows'
        run: |
          for ext in ctype curl dom fileinfo filter iconv mbstring openssl pdo_sqlite \
                     phar session simplexml sqlite3 tokenizer xml xmlreader xmlwriter zlib; do
            "${PHP_PREFIX}/bin/php" -m | grep -qix "$ext" || { echo "missing extension: $ext"; exit 1; }
          done

      - name: Verify built extension set (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # no fileinfo: forced shared on Windows, not embeddable statically
          $mods = & "$env:PHP_PREFIX\php.exe" -m
          foreach ($ext in 'ctype','curl','dom','filter','iconv','mbstring','openssl','pdo_sqlite','phar','session','simplexml','sqlite3','tokenizer','xml','xmlreader','xmlwriter','zlib') {
            if ($mods -notcontains $ext) { throw "missing extension: $ext" }
          }

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: core
          # save the deps cache even when a later cargo step fails
          cache-on-failure: true

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
