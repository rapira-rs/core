name: CI
on:
    push: { branches: [main] }
    pull_request:

permissions:
    contents: read

jobs:
    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with: { persist-credentials: false }
            - uses: dtolnay/rust-toolchain@stable
              with: { components: rustfmt }
            - run: cargo fmt --all --check

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4.11", "8.5.1"] # pin to current patch releases; bump deliberately
        env:
            PHP_PREFIX: ${{ github.workspace }}/.php-zts
        steps:
            - uses: actions/checkout@v4
              with: { persist-credentials: false }

            - name: Install build deps (clang for bindgen, gcc for cc)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential pkg-config curl libclang-dev llvm-dev

            - name: Cache ZTS PHP
              id: php
              uses: actions/cache@v4
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-zts-${{ runner.os }}-${{ matrix.php }}-embed-nosignals-v1

            - name: Build ZTS PHP (embed SAPI) from source
              if: steps.php.outputs.cache-hit != 'true'
              run: |
                  curl -fsSL "https://www.php.net/distributions/php-${{ matrix.php }}.tar.gz" | tar xz
                  cd "php-${{ matrix.php }}"
                  ./configure \
                    --prefix="${PHP_PREFIX}" \
                    --enable-zts \
                    --enable-embed=shared \
                    --disable-zend-signals \
                    --disable-all --disable-cgi --without-pear
                  make -j"$(nproc)"
                  make install

            - name: Expose PHP to build + tests
              run: |
                  echo "${PHP_PREFIX}/bin" >> "$GITHUB_PATH"
                  echo "LD_LIBRARY_PATH=${PHP_PREFIX}/lib" >> "$GITHUB_ENV"

            - name: Sanity-check PHP is ZTS + embed
              run: |
                  php -r 'exit(PHP_ZTS === 1 ? 0 : 1);'
                  test -f "${PHP_PREFIX}/lib/libphp.so"

            - uses: dtolnay/rust-toolchain@stable
              with: { components: clippy }
            - uses: Swatinem/rust-cache@v2

            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo build --workspace
            - run: cargo test --workspace
