name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        php: ["8.4", "8.5"]
    env:
      PHP_PREFIX: ${{ github.workspace }}/.php-embed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: runner.os == 'Linux'
        with:
          php-version: ${{ matrix.php }}
          # keep in sync with ci/php-configure-flags.txt
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pdo_sqlite, phar, session, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
        env:
          phpts: nts
          fail-fast: true # a missing extension fails the job instead of warning

      - name: Build deps for bindgen/cc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

      # setup-php's cached NTS tarball ships the embed SAPI as a versioned
      # /usr/lib/libphpX.Y.so; `-lphp` needs the plain name, so pin the exact
      # matrix version and symlink it into a private dir to link against.
      - name: Expose the PHP embed lib (Linux)
        if: runner.os == 'Linux'
        run: |
          LIBPHP=/usr/lib/libphp${{ matrix.php }}.so
          test -e "$LIBPHP" || { echo "missing $LIBPHP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/phplib"
          ln -sf "$LIBPHP" "$RUNNER_TEMP/phplib/libphp.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/phplib:/usr/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$RUNNER_TEMP/phplib" >> "$GITHUB_ENV"

      # setup-php's macOS NTS bottles don't build the embed SAPI (only the -zts
      # formulas do), so macOS builds PHP from the release tarball with the same
      # flags as release.yml — cached by exact patch version + flags file.
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3 curl oniguruma libxml2 sqlite

      - name: Resolve PHP patch version (macOS)
        id: php
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          FULL=$(curl -fsSL "https://www.php.net/releases/index.php?json&version=${{ matrix.php }}" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "PHP $FULL"

      # Split restore/save: the 15-25 min PHP build is persisted even when a later
      # cargo step fails — actions/cache@v4's post-save only runs on job success.
      - name: Restore PHP embed (macOS)
        id: phpcache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: php-embed-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.php.outputs.full }}-${{ hashFiles('ci/php-configure-flags.txt') }}

      - name: Build PHP embed from release tarball (macOS)
        if: runner.os == 'macOS' && steps.phpcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://www.php.net/distributions/php-${{ steps.php.outputs.full }}.tar.gz" -o php.tar.gz
          tar xf php.tar.gz && cd "php-${{ steps.php.outputs.full }}"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # bare --with-iconv cannot locate libiconv on macOS; the DIR form appended
          # after the file flags wins (autoconf last-wins) — mirrors release.yml.
          ./configure --prefix="$PHP_PREFIX" \
            $(tr '\n' ' ' < "$GITHUB_WORKSPACE/ci/php-configure-flags.txt") \
            --with-iconv="$(xcrun --show-sdk-path)/usr"
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Save PHP embed cache (macOS)
        if: runner.os == 'macOS' && steps.phpcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: php-embed-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.php.outputs.full }}-${{ hashFiles('ci/php-configure-flags.txt') }}

      - name: Expose the PHP embed lib (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PHP_CONFIG=$PHP_PREFIX/bin/php-config" >> "$GITHUB_ENV"
          echo "$PHP_PREFIX/bin" >> "$GITHUB_PATH"
          echo "DYLD_LIBRARY_PATH=$PHP_PREFIX/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$PHP_PREFIX/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # save the deps cache even when a later cargo step fails
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
