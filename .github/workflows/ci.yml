name: CI
on:
    push: { branches: [main] }
    pull_request:
permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
                php: ["8.4", "8.5"]
        env:
            PHP_PREFIX: ${{ github.workspace }}/.php-embed
            # CI-only APM agents for the Linux legs. They are not part of the source-built
            # libphp (.github/php-configure-flags.txt does not change). The pins are manual:
            # dependabot has no ecosystem for vendor tarballs.
            #   https://github.com/newrelic/newrelic-php-agent/releases
            #   https://github.com/DataDog/dd-trace-php/releases
            NEWRELIC_VERSION: "12.9.0.38"
            DDTRACE_VERSION: "1.24.2"
            # Optional: copy the hash from a green run's log to pin the tarball exactly.
            NEWRELIC_SHA256: ""
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with: { persist-credentials: false }

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              if: runner.os == 'Linux'
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: calendar, ctype, curl, dom, exif, ffi, fileinfo, filter, ftp, gettext, iconv, imap, mbstring, opcache, openssl, pdo_sqlite, phar, posix, session, shmop, simplexml, sockets, sqlite3, sysvmsg, sysvsem, sysvshm, tokenizer, xml, xmlreader, xmlwriter, zlib
              env:
                  phpts: nts
                  fail-fast: true # a missing extension fails the job instead of warning

            - name: Verify no coverage driver in the PHP build
              if: runner.os == 'Linux'
              run: |
                  mods=$(php -m); echo "$mods"
                  if grep -qiE '^(xdebug|pcov)$' <<<"$mods"; then
                    echo "::error::a PHP coverage driver is enabled; it overrides zend_error_cb and JIT in the embed SAPI"
                    exit 1
                  fi

            - name: Build deps for bindgen/cc (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev

            - name: Expose the PHP embed lib (Linux)
              if: runner.os == 'Linux'
              run: |
                  LIBPHP=/usr/lib/libphp${{ matrix.php }}.so
                  test -e "$LIBPHP" || { echo "missing $LIBPHP"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/phplib"
                  ln -sf "$LIBPHP" "$RUNNER_TEMP/phplib/libphp.so"
                  echo "LD_LIBRARY_PATH=$RUNNER_TEMP/phplib:/usr/lib" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=-L native=$RUNNER_TEMP/phplib" >> "$GITHUB_ENV"

            # The APM agents go into the extension dir only, never into conf.d, so the test
            # suite does not boot every test with an agent attached. The e2e tests
            # (crates/tests/tests/e2e/apm.rs) load them through their own php.ini and skip
            # when the .so is absent. The load checks below fail the job on a broken install.
            - name: Install the New Relic PHP agent (Linux, CI only)
              if: runner.os == 'Linux'
              run: |
                  set -euo pipefail
                  case "${{ matrix.php }}" in
                    8.4) API=20240924 ;;
                    8.5) API=20250925 ;;
                    *) echo "::error::no New Relic module-API mapping for PHP ${{ matrix.php }}"; exit 1 ;;
                  esac
                  case "$(uname -m)" in
                    x86_64)  NR_ARCH=x64 ;;
                    aarch64) NR_ARCH=aarch64 ;;
                    *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
                  esac
                  url="https://download.newrelic.com/php_agent/archive/${NEWRELIC_VERSION}/newrelic-php5-${NEWRELIC_VERSION}-linux.tar.gz"
                  curl -fsSL --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/newrelic.tar.gz"
                  if [ -n "${NEWRELIC_SHA256:-}" ]; then
                    echo "${NEWRELIC_SHA256}  $RUNNER_TEMP/newrelic.tar.gz" | sha256sum -c -
                  else
                    echo "newrelic tarball sha256: $(sha256sum "$RUNNER_TEMP/newrelic.tar.gz" | cut -d' ' -f1)"
                  fi
                  # tarball layout: newrelic-php5-<ver>-linux/agent/{x64,aarch64}/newrelic-<modapi>.so.
                  # tar fails when the wildcard matches nothing, so a layout change fails the step.
                  mkdir -p "$RUNNER_TEMP/newrelic"
                  tar -xzf "$RUNNER_TEMP/newrelic.tar.gz" -C "$RUNNER_TEMP/newrelic" \
                      --strip-components=1 --wildcards "*/agent/${NR_ARCH}/newrelic-${API}.so"
                  EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
                  sudo install -m 0644 "$RUNNER_TEMP/newrelic/agent/${NR_ARCH}/newrelic-${API}.so" \
                      "$EXT_DIR/newrelic.so"
                  php -d "extension=$EXT_DIR/newrelic.so" \
                      -d newrelic.daemon.dont_launch=3 -d newrelic.logfile=/dev/null -m | grep -qix newrelic

            - name: Install the Datadog PHP tracer (Linux, CI only)
              if: runner.os == 'Linux'
              run: |
                  set -euo pipefail
                  case "${{ matrix.php }}" in
                    8.4) API=20240924 ;;
                    8.5) API=20250925 ;;
                    *) echo "::error::no ddtrace module-API mapping for PHP ${{ matrix.php }}"; exit 1 ;;
                  esac
                  ARCH=$(uname -m) # x86_64 / aarch64 match the asset names verbatim
                  url="https://github.com/DataDog/dd-trace-php/releases/download/${DDTRACE_VERSION}/dd-library-php-${DDTRACE_VERSION}-${ARCH}-linux-gnu-${API}.tar.gz"
                  curl -fsSL --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/ddtrace.tar.gz"
                  # per-ABI NTS bundle: rapira needs only ./dd-library-php/trace/ext/<api>/ddtrace.so.
                  # Non-PECL builds compile the PHP-side sources into the extension.
                  mkdir -p "$RUNNER_TEMP/ddtrace"
                  tar -xzf "$RUNNER_TEMP/ddtrace.tar.gz" -C "$RUNNER_TEMP/ddtrace" \
                      --wildcards "*/trace/ext/${API}/ddtrace.so"
                  EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
                  sudo install -m 0644 "$RUNNER_TEMP/ddtrace/dd-library-php/trace/ext/${API}/ddtrace.so" \
                      "$EXT_DIR/ddtrace.so"
                  DD_TRACE_ENABLED=0 DD_INSTRUMENTATION_TELEMETRY_ENABLED=0 DD_TRACE_STARTUP_LOGS=0 \
                    php -d "extension=$EXT_DIR/ddtrace.so" -m | grep -qix ddtrace

            - name: Install build deps (macOS)
              if: runner.os == 'macOS'
              run: brew install pkg-config openssl@3 curl oniguruma libxml2 sqlite libffi gettext

            - name: Resolve PHP patch version (macOS)
              id: php
              if: runner.os == 'macOS'
              run: |
                  set -euo pipefail
                  FULL=$(curl -fsSL "https://www.php.net/releases/index.php?json&version=${{ matrix.php }}" \
                          | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
                  echo "full=$FULL" >> "$GITHUB_OUTPUT"
                  echo "PHP $FULL"

            - name: Restore PHP embed (macOS)
              id: phpcache
              if: runner.os == 'macOS'
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-embed-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.php.outputs.full }}-${{ hashFiles('.github/php-configure-flags.txt') }}

            - name: Build PHP embed from release tarball (macOS)
              if: runner.os == 'macOS' && steps.phpcache.outputs.cache-hit != 'true'
              env:
                  PHP_FULL: ${{ steps.php.outputs.full }}
              run: |
                  set -euo pipefail
                  curl -fsSL "https://www.php.net/distributions/php-${PHP_FULL}.tar.gz" -o php.tar.gz
                  tar xf php.tar.gz && cd "php-${PHP_FULL}"
                  export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
                  export CFLAGS="-O2"
                  ./configure --prefix="$PHP_PREFIX" \
                    $(tr '\n' ' ' < "$GITHUB_WORKSPACE/.github/php-configure-flags.txt") \
                    --with-iconv="$(xcrun --show-sdk-path)/usr" \
                    --with-gettext="$(brew --prefix gettext)"
                  make -j"$(getconf _NPROCESSORS_ONLN)"
                  make install

            - name: Save PHP embed cache (macOS)
              if: runner.os == 'macOS' && steps.phpcache.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ env.PHP_PREFIX }}
                  key: php-embed-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.php.outputs.full }}-${{ hashFiles('.github/php-configure-flags.txt') }}

            - name: Expose the PHP embed lib (macOS)
              if: runner.os == 'macOS'
              run: |
                  echo "PHP_CONFIG=$PHP_PREFIX/bin/php-config" >> "$GITHUB_ENV"
                  echo "$PHP_PREFIX/bin" >> "$GITHUB_PATH"
                  echo "DYLD_LIBRARY_PATH=$PHP_PREFIX/lib" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=-L native=$PHP_PREFIX/lib" >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with: { components: clippy }
            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  cache-on-failure: true
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo build --workspace
            - run: cargo test --workspace
            - run: cargo build -p rapira_core --bin rapira && cargo test -p tests --test e2e --features e2e -- --test-threads=1
