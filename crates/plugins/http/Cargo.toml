[package]
name = "rapira_http"
version = "0.8.1"
edition.workspace = true
publish = false
license = "MIT"
description = "HTTP front for rapira - terminates HTTP and answers every request from PHP"

[lints]
workspace = true

[dependencies]
extension_api = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http-body = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "io-util"] }
