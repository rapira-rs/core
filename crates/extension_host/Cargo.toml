[package]
name = "extension_host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
php_sys = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# `async` is not a default feature; the guest is driven async by the host.
wasmtime = { version = "46", features = ["async"] }
wasmtime-wasi = "46"
# Reads the `rapira:api-version` custom section before instantiating.
wasmparser = "0.251"
# A shared multi-thread runtime drives all extension tasks.
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
