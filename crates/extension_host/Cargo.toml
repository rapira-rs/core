[package]
name = "extension_host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
php_sys = { workspace = true }
extension_api = { workspace = true }
# A shared multi-thread runtime drives all extension tasks.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
# `sigwait`-based shutdown: block SIGINT/SIGTERM and reap them without a signal handler,
# so rapira coexists with Zend's per-request signal management.
libc = "0.2"
