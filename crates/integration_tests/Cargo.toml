[package]
name = "integration_tests"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
php_sys = { path = "../php_sys" }
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"

[dev-dependencies]
anyhow = "1"
serde_json = "1"
extension_api = { workspace = true }
extension_host = { path = "../extension_host" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# E2E harness (tests/e2e): process control for the spawned rapira binary.
libc = "0.2"

# The spawn-the-binary E2E suite forks worker processes and runs request storms;
# gated behind a feature so `cargo test --workspace` skips it. Run it isolated
# (build the rapira bin first): cargo test -p integration_tests --test e2e --features e2e
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
