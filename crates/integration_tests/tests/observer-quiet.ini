; Like php.ini, plus the observer API - but with zend_test's markers off, so bodies
; stay readable. Observers must be registered for the frame chain to be tracked at all.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
zend.exception_ignore_args = 0
zend_test.observer.enabled = 1
zend_test.observer.observe_all = 1
zend_test.observer.show_output = 0
