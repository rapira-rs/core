; Test-only PHP config: make request-level compile/fatal errors visible in the
; response body so the integration suite is deterministic regardless of the
; ambient php.ini (CI's php.ini-production sets display_errors=Off).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
zend.exception_ignore_args = 0