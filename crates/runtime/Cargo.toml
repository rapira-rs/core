[package]
name = "rapira_runtime"
version = "0.8.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
php_sys = { workspace = true }
extension_api = { workspace = true }
# A shared multi-thread runtime drives all extension tasks.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
libc = "0.2"
# multipart parsing over the buffered body + file-part spooling
memchr = "2"
httparse = "1"
tempfile = "3"

[dev-dependencies]
bytes = { workspace = true }
