[package]
name = "tests"
version = "0.8.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
php_sys = { path = "../php_sys" }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Capture layer (init_log_capture); tracing-log normalizes still-bridged records.
tracing-subscriber = "0.3"
tracing-log = "0.2"

[dev-dependencies]
extension_api = { workspace = true }
rapira_runtime = { path = "../runtime" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# E2E harness (tests/e2e): process control for the spawned rapira binary.
libc = "0.2"
# E2E log-format assertions (tests/e2e/logging.rs).
serde_json = "1"

# The spawn-the-binary E2E suite forks worker processes and runs request storms;
# gated behind a feature so `cargo test --workspace` skips it. Run it isolated
# (build the rapira bin first): cargo test -p tests --test e2e --features e2e
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
