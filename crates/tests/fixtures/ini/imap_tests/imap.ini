; imap suite: default_socket_timeout is 17, not the built-in 60, so the tests can
; tell the MINIT snapshot from the default. display_errors stays off because
; RSHUTDOWN reports an undrained imap error as an E_NOTICE.
display_errors = Off
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
default_socket_timeout = 17
session.gc_probability = 0
