; imap suite: default_socket_timeout 17 differs from the built-in 60, so the MINIT snapshot is provable; display_errors off keeps the RSHUTDOWN notice out of bodies.
display_errors = Off
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
default_socket_timeout = 17
session.gc_probability = 0
