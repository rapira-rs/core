[package]
name = "extension_api"
version = "0.8.0"
edition.workspace = true
publish = false
license = "MIT"
description = "Native rapira extension contract - the API every extension implements to drive PHP"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# Master-side pre-fork socket binding (sync syscalls; keeps this crate tokio-free).
socket2 = "0.6"

[dev-dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["rt", "macros"] }
