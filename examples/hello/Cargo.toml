[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

# An extension is a cdylib; the SDK stays an rlib so this crate can depend on it.
[lib]
crate-type = ["cdylib"]

[dependencies]
extension_api = { workspace = true }
# `join!` for awaiting several `exec`s concurrently.
futures = { version = "0.3", default-features = false, features = ["async-await"] }

[lints]
workspace = true
